<template>
  <lightning-card title="Case Action Workbench" icon-name="standard:case">
    <div class="workbench slds-p-horizontal_medium slds-p-bottom_medium">
      <c-case-workbench-filters
        scope={scope}
        status={status}
        search-term={searchTerm}
        disabled={isBusy}
        onfilterchange={handleFilterChange}
      ></c-case-workbench-filters>

      <c-case-workbench-actions
        selected-count={selectedCount}
        is-busy={isBusy}
        can-set-priority={canSetPriority}
        can-assign-to-me={canAssignToMe}
        onsetpriority={handleSetPriority}
        onassigntome={handleAssignToMe}
      ></c-case-workbench-actions>

      <template lwc:if={hasActionResults}>
        <section
          class="results slds-box slds-theme_default slds-m-bottom_medium"
          aria-labelledby="results-heading"
          data-testid="action-results"
        >
          <div
            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start slds-m-bottom_small"
          >
            <div>
              <h2
                id="results-heading"
                class="slds-text-heading_small slds-m-bottom_xx-small"
              >
                {resultsActionLabel} results
              </h2>
              <p class="slds-text-body_small" aria-live="polite" role="status">
                {resultsSummary}
              </p>
            </div>
            <lightning-button
              label="Dismiss results"
              variant="base"
              onclick={clearActionResults}
            ></lightning-button>
          </div>

          <div class="slds-grid slds-wrap slds-gutters">
            <section
              class="slds-col slds-size_1-of-1 slds-large-size_1-of-2"
              aria-label="Successful Cases"
            >
              <h3 class="slds-text-title_bold slds-m-bottom_x-small">
                Updated ({successCount})
              </h3>
              <template lwc:if={hasSuccessfulResults}>
                <ul class="result-list result-list_success">
                  <template for:each={successfulResults} for:item="result">
                    <li key={result.recordId} class="result-item">
                      <p class="result-record">
                        <strong>{result.caseNumber}</strong> — {result.subject}
                      </p>
                      <p class="slds-text-body_small">{result.message}</p>
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:else>
                <p class="slds-text-body_small">No Cases were updated.</p>
              </template>
            </section>

            <section
              class="slds-col slds-size_1-of-1 slds-large-size_1-of-2"
              aria-label="Cases that need attention"
            >
              <h3 class="slds-text-title_bold slds-m-bottom_x-small">
                Needs attention ({failureCount})
              </h3>
              <template lwc:if={hasFailedResults}>
                <ul class="result-list result-list_failure">
                  <template for:each={failedResults} for:item="result">
                    <li key={result.recordId} class="result-item">
                      <p class="result-record">
                        <strong>{result.caseNumber}</strong> — {result.subject}
                      </p>
                      <p class="slds-text-body_small">{result.message}</p>
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:else>
                <p class="slds-text-body_small">No Cases need attention.</p>
              </template>
            </section>
          </div>
        </section>
      </template>

      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading Cases"
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={loadError}>
        <div class="slds-text-color_error slds-p-vertical_medium" role="alert">
          {loadError}
        </div>
      </template>

      <div class="table-wrap">
        <lightning-datatable
          key-field="Id"
          data={rows}
          columns={columns}
          selected-rows={selectedRowIds}
          disabled-rows={disabledRowIds}
          errors={tableErrors}
          max-row-selection="200"
          onrowselection={handleRowSelection}
          aria-label="Open Cases"
        ></lightning-datatable>
      </div>

      <div
        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_small"
      >
        <p class="slds-text-body_small" aria-live="polite">
          {pageSummary} · {selectedCount} selected (maximum 200)
        </p>
        <div
          class="slds-button-group"
          role="group"
          aria-label="Case page navigation"
        >
          <lightning-button
            label="Previous"
            onclick={handlePrevious}
            disabled={isPreviousDisabled}
          ></lightning-button>
          <lightning-button
            label="Next"
            onclick={handleNext}
            disabled={isNextDisabled}
          ></lightning-button>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
